<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPK 마작</title>
  <meta name="description" content="스피키와 1:1로 두는 3D 1인칭 리치 마작">
  <meta name="theme-color" content="#1a1424">
  <meta property="og:title" content="SPK 마작">
  <meta property="og:description" content="스피키와 1:1로 두는 3D 1인칭 리치 마작">
  <link rel="icon" type="image/png" href="image/icon.png">
  <link rel="stylesheet" href="style.css">
  <!-- three.js는 vendor/에 함께 담아 둔다(외부 CDN 없이 동작) -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="inspect-dim"></div>

  <div id="hud">
    <div id="info" class="panel">
      <div id="round">동 1국</div>
      <div class="row" id="mode"></div>
      <div class="row"><span id="honba">0본장</span> · <span id="sticks">리치봉 0</span></div>
      <div class="row">남은 패 <b id="remain">-</b></div>
      <div class="dora-box"><span>도라 표시패</span><div id="dora"></div></div>
      <div id="cards" class="hidden"></div>
    </div>

    <div id="opp-plate" class="plate panel">
      <span class="wind" id="opp-wind"></span>
      <span class="name">스피키</span>
      <span class="pts" id="opp-pts">25,000</span>
      <span class="riichi-badge hidden" id="opp-riichi">리치</span>
    </div>

    <div id="butter" class="hidden">
      <div class="butter-img"><img src="image/help_of_butter.png" alt=""></div>
      <div class="butter-count">3/3</div>
      <div class="butter-say"></div>
    </div>

    <div id="me-plate" class="plate panel">
      <span class="wind" id="me-wind"></span>
      <span class="name">나</span>
      <span class="pts" id="me-pts">25,000</span>
      <span class="riichi-badge hidden" id="me-riichi">리치</span>
    </div>

    <div id="wait-info" class="panel hidden"></div>
    <div id="actions"></div>
    <button id="slam" class="act hidden">테이블 내려치기</button>
    <div id="bubble"></div>
    <div id="toast"></div>

    <div id="modal" class="hidden"><div class="card" id="modal-card"></div></div>

    <div id="confirm" class="hidden">
      <div class="card confirm-card">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <div class="confirm-buttons">
          <button id="confirm-yes" class="act win"></button>
          <button id="confirm-extra" class="act flip hidden"></button>
          <button id="confirm-no" class="act ghost"></button>
        </div>
      </div>
    </div>

    <div id="main-menu" class="menu-screen hidden">
      <nav class="menu-list">
        <button data-act="start">게임 시작</button>
        <button data-act="achievements">업적</button>
        <button data-act="settings">설정</button>
        <button data-act="exit">종료</button>
      </nav>
    </div>

    <div id="menu-choice" class="menu-screen hidden">
      <div class="menu-page-body">
        <h2 id="menu-choice-title"></h2>
        <nav class="menu-list" id="menu-choice-list"></nav>
        <button id="menu-choice-back">뒤로</button>
      </div>
    </div>

    <div id="menu-settings" class="menu-screen hidden">
      <div class="settings-body">
        <h2>설정</h2>
        <section>
          <h3>화면 설정</h3>
          <div class="seg" id="display-mode">
            <button data-mode="window">창모드</button>
            <button data-mode="fullscreen">전체화면</button>
            <button data-mode="borderless">테두리 없는 창모드</button>
          </div>
          <p class="hint">웹 브라우저에서는 전체화면과 테두리 없는 창모드가 같은 방식으로 동작해요.</p>
        </section>
        <section>
          <h3>소리 설정</h3>
          <label class="slider"><span>BGM 음량</span><input type="range" min="0" max="100" data-vol="bgm"><b></b></label>
          <label class="slider"><span>SFX 음량</span><input type="range" min="0" max="100" data-vol="sfx"><b></b></label>
          <label class="slider"><span>스피키 음량</span><input type="range" min="0" max="100" data-vol="voice"><b></b></label>
        </section>
        <button id="settings-back">뒤로</button>
      </div>
    </div>

    <div id="menu-page" class="menu-screen hidden">
      <div class="menu-page-body">
        <h2 id="menu-page-title"></h2>
        <p id="menu-page-text"></p>
        <button id="menu-back">뒤로</button>
      </div>
    </div>

    <div id="fade"></div>
    <div id="loading" class="overlay"><div class="spinner"></div><p>불러오는 중…</p></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
